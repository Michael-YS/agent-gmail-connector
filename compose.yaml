name: agentmail

services:
  agentmail:
    build:
      context: .
      dockerfile: Dockerfile
      platforms: [linux/amd64]
    image: ${AGENTMAIL_IMAGE:-agentmail:local}
    platform: linux/amd64
    command: [serve]
    env_file:
      - ./.env
    environment:
      HOST: 0.0.0.0
      PORT: 18080
      DATABASE_URL: sqlite:///var/lib/agentmail/agentmail.db
      LOGIN_CLIENT_SECRET_FILE: /run/secrets/login_client_secret
      GMAIL_CLIENT_SECRET_FILE: /run/secrets/gmail_client_secret
      CREDENTIAL_ENCRYPTION_KEYRING_FILE: /run/secrets/credential_encryption_keyring
      SESSION_CSRF_SECRET_FILE: /run/secrets/session_csrf_secret
    ports:
      - "127.0.0.1:${AGENTMAIL_PORT:-18080}:18080"
    volumes:
      - agentmail-data:/var/lib/agentmail
      - ${AGENTMAIL_BACKUP_DIR:-./backups}:/var/backups/agentmail
      - type: bind
        source: ${AGENTMAIL_SECRETS_DIR:-./secrets}/login_client_secret
        target: /run/secrets/login_client_secret
        read_only: true
      - type: bind
        source: ${AGENTMAIL_SECRETS_DIR:-./secrets}/gmail_client_secret
        target: /run/secrets/gmail_client_secret
        read_only: true
      - type: bind
        source: ${AGENTMAIL_SECRETS_DIR:-./secrets}/credential_encryption_keyring
        target: /run/secrets/credential_encryption_keyring
        read_only: true
      - type: bind
        source: ${AGENTMAIL_SECRETS_DIR:-./secrets}/session_csrf_secret
        target: /run/secrets/session_csrf_secret
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:18080/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  agentmail-data:
