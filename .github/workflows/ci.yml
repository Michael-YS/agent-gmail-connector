name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Format, check and test
        run: |
          cargo fmt --all -- --check
          cargo check --all-targets --all-features --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-features --locked

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2

      - name: Dependency audit and policy
        run: |
          # sqlx keeps the optional MySQL backend in Cargo.lock, but this
          # SQLite-only build must not resolve its rsa dependency.
          test -z "$(cargo tree --locked --target all --all-features -i rsa 2>/dev/null)"
          cargo audit --ignore RUSTSEC-2023-0071
          cargo deny check

      - name: Build amd64 image
        run: docker build --platform linux/amd64 --tag agentmail:ci .

      - name: Container smoke check
        run: bash scripts/container-smoke.sh agentmail:ci

      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e
        with:
          version: v0.75.0
          image-ref: agentmail:ci
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
