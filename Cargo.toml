[package]
name = "agentmail"
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[dependencies]
anyhow = "1"
argon2 = "0.5"
askama = "0.14"
async-trait = "0.1"
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["prebuilt-nasm"] }
axum = { version = "0.8", features = ["form", "http2", "json", "macros", "multipart"] }
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-core = "0.3"
hex = "0.4"
http = "1"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
mail-builder = "0.5"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rmcp = { version = "=3.3.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["chrono", "runtime-tokio-rustls", "sqlite", "uuid"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "cors", "limit", "request-id", "sensitive-headers", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
zeroize = "1"

[dev-dependencies]
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
