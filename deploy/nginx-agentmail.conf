upstream agentmail_backend {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name agentmail.michaelsun.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / { return 308 https://agentmail.michaelsun.top$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agentmail.michaelsun.top;
    ssl_certificate /etc/letsencrypt/live/agentmail.michaelsun.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentmail.michaelsun.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    client_max_body_size 30m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location /mcp {
        proxy_pass http://agentmail_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host agentmail.michaelsun.top;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location ~ ^/api/v1/connections/[^/]+/drafts(?:/[^/]+)?$ {
        proxy_pass http://agentmail_backend;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_set_header Host agentmail.michaelsun.top;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://agentmail_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host agentmail.michaelsun.top;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
}
